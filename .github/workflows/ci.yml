# Controle op elke push naar developer en op elke pull request.
# Draait op Windows, macOS en Linux: de kaartlezer-code (fase 3) verschilt per platform.
name: CI

on:
  push:
    branches: [developer]
  pull_request:
    branches: [developer, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Unit-tests (Vitest)
        run: npm test

      - name: CLI uit de build starten
        run: node packages/eid/dist/cli.js --version

      - name: pcsc-lite installeren (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite1

      # Laadt koffi en de echte PC/SC-bibliotheek van het platform (winscard.dll, PCSC.framework,
      # libpcsclite). Er is geen lezer op de runner, maar zo weten we dat alle functies gevonden worden.
      - name: PC/SC laden zonder lezer
        run: node packages/eid/dist/cli.js readers

      - name: Virtuele lezer uitlezen via de CLI
        run: node packages/eid/dist/cli.js read --mock

      - name: Playground bouwen (Next.js)
        if: runner.os == 'Linux'
        run: npm run build -w @dafkedd/eid-playground
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # Het zelfstandige programma bouwen en echt laten draaien op elk platform.
  exe:
    name: programma (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: pcsc-lite installeren (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite1

      - name: Programma bouwen
        run: npm run build:exe

      - name: Programma testen (CLI, PC/SC laden, virtuele lezer)
        run: |
          EXE=$(ls dist-bin/dafke-eid-* | grep -v sha256)
          "$EXE" --version
          "$EXE" diag
          "$EXE" read --mock

      - name: Testpagina en bridge vanuit het programma
        run: |
          EXE=$(ls dist-bin/dafke-eid-* | grep -v sha256)
          "$EXE" serve --mock --port 47899 > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:47899/v1/status && break; sleep 1; done
          curl -sf http://127.0.0.1:47899/ | grep -q "DafkeDD eID"
          curl -sf -H "Sec-Fetch-Site: same-origin" http://127.0.0.1:47899/v1/test/diag | grep -q "SELECT identiteit: SW 9000"
          curl -sf -H "Origin: http://localhost:3000" http://127.0.0.1:47899/v1/card | grep -q '"lastName":"Specimen"'
          cat serve.log

      - name: Installeren en verwijderen (Windows)
        if: runner.os == 'Windows'
        run: |
          EXE=$(ls dist-bin/dafke-eid-*.exe)
          "$EXE" install --silent --port 47898
          curl -sf http://127.0.0.1:47898/v1/status
          reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" //v "DafkeDD eID"
          test -f "$LOCALAPPDATA/DafkeDD/eid/dafke-eid.exe"
          test -f "$APPDATA/Microsoft/Windows/Start Menu/Programs/DafkeDD eID testen.url"
          "$LOCALAPPDATA/DafkeDD/eid/dafke-eid.exe" uninstall --silent
          sleep 5
          ! curl -sf http://127.0.0.1:47898/v1/status
          ! reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" //v "DafkeDD eID"

      - name: Inno Setup klaarzetten (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Setup bouwen (Windows)
        if: runner.os == 'Windows'
        run: npm run build:setup

      # Echte installatie met de setup: stil, met instellingen, update, en verwijderen via unins000.exe.
      - name: Setup installeren, bijwerken en verwijderen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Resolve-Path "dist-bin\dafke-eid-setup-windows-x64.exe").Path
          $dir = "$env:LOCALAPPDATA\DafkeDD\eid"
          $run = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $apps = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{318FA63C-09B5-4C3B-A80A-0A742BE1826B}_is1"
          $ownApps = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\DafkeDD-eID"
          $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\DafkeDD eID testen.url"
          function Status { try { (Invoke-RestMethod http://127.0.0.1:47897/v1/status -TimeoutSec 2).name } catch { $null } }
          function WaitRunning { for ($i = 0; $i -lt 30 -and (Status) -ne "dafke-eid"; $i++) { Start-Sleep 1 }; if ((Status) -ne "dafke-eid") { throw "het programma draait niet" } }

          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/PORT=47897", "/ORIGINS=https://app.voorbeeld.be" -Wait
          WaitRunning
          if (-not (Test-Path "$dir\unins000.exe")) { throw "unins000.exe ontbreekt" }
          if (-not (Get-ItemProperty $run -Name "DafkeDD eID" -ErrorAction SilentlyContinue)) { throw "autostart ontbreekt" }
          if (-not (Test-Path $apps)) { throw "Apps-vermelding van de setup ontbreekt" }
          if (Test-Path $ownApps) { throw "dubbele Apps-vermelding" }
          if (-not (Test-Path $shortcut)) { throw "snelkoppeling ontbreekt" }
          if (-not (Select-String -Path "$dir\config.json" -Pattern "app.voorbeeld.be" -Quiet)) { throw "origin niet bewaard" }
          Write-Host "geïnstalleerd: $((Get-ItemProperty $apps).DisplayName) $((Get-ItemProperty $apps).DisplayVersion)"

          # Update: nog eens installeren zonder parameters houdt de instellingen.
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          WaitRunning
          if (-not (Select-String -Path "$dir\config.json" -Pattern "app.voorbeeld.be" -Quiet)) { throw "instellingen verloren bij update" }

          # dafke-eid uninstall geeft door aan de setup; die verwijdert alles.
          & "$dir\dafke-eid.exe" uninstall | Write-Host
          for ($i = 0; $i -lt 30 -and (Test-Path $dir); $i++) { Start-Sleep 1 }
          if (Test-Path $dir) { throw "map niet verwijderd" }
          if (Status) { throw "programma draait nog" }
          if (Get-ItemProperty $run -Name "DafkeDD eID" -ErrorAction SilentlyContinue) { throw "autostart niet verwijderd" }
          if (Test-Path $apps) { throw "Apps-vermelding niet verwijderd" }
          if (Test-Path $shortcut) { throw "snelkoppeling niet verwijderd" }
          Write-Host "setup: installeren, bijwerken en verwijderen OK"

      - uses: actions/upload-artifact@v7
        with:
          name: dafke-eid-${{ runner.os }}
          path: dist-bin/
          retention-days: 7

  # Fase 9: het ingepakte pakket installeren in lege Next.js- en NestJS-projecten (examples/)
  # en de hele keten testen: website → programma (virtuele kaart) → token → server.
  install:
    name: installatietest (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:install
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # Eén vaste naam voor de ruleset op main ("CI-check"), ongeacht de matrix.
  ci-check:
    name: CI-check
    needs: [test, exe, install]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Alle platformen groen?
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.exe.result }}" != "success" ] || [ "${{ needs.install.result }}" != "success" ]; then
            echo "::error::Een of meer platformen faalden."
            exit 1
          fi
